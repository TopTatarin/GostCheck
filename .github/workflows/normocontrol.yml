name: Normocontrol

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: normocontrol-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup normocontrol
        uses: ./.github/actions/setup-normocontrol
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/normocontrol
      - name: Pytest
        run: >
          python -m pytest -q
          --cov=normocontrol
          --cov-report=term-missing
          --cov-fail-under=85

  build-latex:
    name: build-latex
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup normocontrol
        uses: ./.github/actions/setup-normocontrol
        with:
          install-python: "false"
          install-tex: "true"
      - name: Diagnostic LaTeX build
        id: latex
        run: |
          set -euo pipefail
          mkdir -p build/latex
          fixture_dir="$GITHUB_WORKSPACE/tests/fixtures/latex-ci/compile-pass/source with spaces"
          out_dir="$GITHUB_WORKSPACE/build/latex/diagnostic"
          mkdir -p "$out_dir"
          pushd "$fixture_dir" >/dev/null
          latexmk -xelatex -Werror -interaction=nonstopmode -halt-on-error -file-line-error \
            -outdir="$out_dir" main.tex 2>&1 | tee "$out_dir/latexmk.log"
          popd >/dev/null
          test -s "$out_dir/main.pdf"
      - name: Upload LaTeX logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: latex-build-${{ github.sha }}
          path: build/latex/
          if-no-files-found: warn

  formal-gate:
    name: formal-gate
    needs: [lint-and-unit]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup normocontrol
        uses: ./.github/actions/setup-normocontrol
      - name: Formal gate on pass fixture
        id: pass
        run: |
          set -euo pipefail
          normocontrol run tests/fixtures/demo/pass --no-llm --out build/pass
      - name: Self-check fail fixture exits 2
        run: |
          set +e
          normocontrol run tests/fixtures/demo/fail --no-llm --out build/fail
          code=$?
          set -e
          test "$code" -eq 2
      - name: Setup mandatory TeX toolchain
        uses: ./.github/actions/setup-normocontrol
        with:
          install-python: "false"
          install-tex: "true"
      - name: Compile and validate synthetic LaTeX fixtures
        run: |
          set -euo pipefail

          run_latex() {
            local fixture_dir="$GITHUB_WORKSPACE/$1"
            local out_dir="$GITHUB_WORKSPACE/$2"
            mkdir -p "$out_dir"
            pushd "$fixture_dir" >/dev/null
            set +e
            latexmk -xelatex -Werror -interaction=nonstopmode -halt-on-error -file-line-error \
              -outdir="$out_dir" main.tex 2>&1 | tee "$out_dir/latexmk.log"
            local latexmk_code="${PIPESTATUS[0]}"
            set -e
            popd >/dev/null
            if [ "$latexmk_code" -ne 0 ]; then
              return "$latexmk_code"
            fi
            if [ ! -s "$out_dir/main.pdf" ]; then
              echo "latexmk exited successfully but did not create a non-empty PDF"
              return 1
            fi
            if grep -Eiq \
              'LaTeX Warning: (There were undefined references|Reference .+ undefined|Citation .+ undefined)|Package (biblatex|natbib) Warning:.*(undefined|rerun Biber)' \
              "$out_dir/main.log"; then
              echo "blocking unresolved reference diagnostic found in $out_dir/main.log"
              return 1
            fi
          }

          expect_latex_failure() {
            if run_latex "$1" "$2"; then
              echo "fixture $1 unexpectedly passed LaTeX validation"
              return 1
            fi
          }

          run_latex \
            "tests/fixtures/latex-ci/compile-pass/source with spaces" \
            "build/latex/formal-pass"
          test -s build/latex/formal-pass/main.bbl
          expect_latex_failure \
            "tests/fixtures/latex-ci/compile-fail" \
            "build/latex/compile-fail"
          expect_latex_failure \
            "tests/fixtures/latex-ci/unresolved-reference" \
            "build/latex/unresolved-reference"
          expect_latex_failure \
            "tests/fixtures/latex-ci/biber-fail" \
            "build/latex/biber-fail"
      - name: Run blocking ChkTeX checks
        run: |
          set -euo pipefail

          run_chktex() {
            local source="$GITHUB_WORKSPACE/$1"
            local log="$GITHUB_WORKSPACE/$2"
            mkdir -p "$(dirname "$log")"
            set +e
            chktex -q "$source" 2>&1 | tee "$log"
            local chktex_code="${PIPESTATUS[0]}"
            set -e
            return "$chktex_code"
          }

          run_chktex \
            "tests/fixtures/latex-ci/compile-pass/source with spaces/main.tex" \
            "build/latex/formal-pass/chktex.log"
          if run_chktex \
            "tests/fixtures/latex-ci/chktex-fail/main.tex" \
            "build/latex/chktex-fail/chktex.log"; then
            echo "blocking ChkTeX fixture unexpectedly passed"
            exit 1
          fi
      - name: Upload normocontrol report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: normocontrol-report-${{ github.sha }}
          path: |
            build/pass/report.json
            build/pass/report.md
            build/pass/summary.json
            build/pass/run_state.json
            build/fail/report.json
            build/fail/report.md
            build/fail/summary.json
            build/latex/
          if-no-files-found: warn

  publish-report:
    name: publish-report
    needs: [formal-gate]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup normocontrol
        uses: ./.github/actions/setup-normocontrol
      - name: Download formal report artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: normocontrol-report-${{ github.sha }}
          path: build/artifact
      - name: Publish or refresh PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          summary=""
          for candidate in \
            build/artifact/pass/summary.json \
            build/artifact/summary.json \
            build/pass/summary.json
          do
            if [ -f "$candidate" ]; then
              summary="$candidate"
              break
            fi
          done
          if [ -z "$summary" ]; then
            echo "summary artifact missing; publishing neutral notice"
            python scripts/ci_comment.py --missing-artifact --neutral
          else
            python scripts/ci_comment.py --summary "$summary"
          fi
