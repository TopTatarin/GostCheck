# ============================================================================
# rubric.yaml — машиночитаемая рубрика нормоконтроля ВКР (LaTeX + CI)
# Составлена по двум методичкам кафедры (M1 — оформление, M2 — содержание).
# 64 правила. Блокируют пайплайн только детерминированные проверки
# (class/script); все llm/vision-правила — advisory (warn/info).
# Статус: draft — параметры из params_to_approve требуют утверждения кафедрой.
# ============================================================================

meta:
  version: "2025.1-draft"
  sources:
    M1: "Коротко: оформление ВКР (шрифты, поля, рисунки, таблицы, ссылки)"
    M2: "Методические рекомендации по подготовке ВКР 2025 (структура и содержание)"
    DEP: "Требование кафедры вне методичек — требует формального утверждения"
  layers:
    class:  "гарантируется .cls-классом кафедры (нарушить нельзя, CI проверяет целостность класса)"
    script: "детерминированная проверка в CI: исходник и/или скомпилированный PDF"
    llm:    "семантическая проверка через LLM API, structured output, temperature=0"
    vision: "проверка извлечённых из PDF изображений (VLM или вручную)"
  severity:
    error: "блокирует пайплайн"
    warn:  "предупреждение в отчёте"
    info:  "информационно"
  policy: "все llm/vision-правила — только warn/info (недетерминизм + prompt injection)"
  params_to_approve:            # кафедра фиксирует до запуска
    font_size_pt: 14            # методичка даёт диапазон 12–14
    fig_numbering: "сквозная"   # или "по разделам" — M1 допускает оба
    defense_year: 2026
    geometry_tolerance_pt: 0.5  # утверждённый допуск PDF-координат FMT-05
    recent_sources_share: 0.5   # доля источников за последние 5 лет для REV-03

rules:
  # ── ИНФРАСТРУКТУРА ─────────────────────────────────────────────
  - id: SYS-01
    src: DEP
    rule: "Используется неизменённый класс кафедры"
    layer: script
    check: "sha256 файлов .cls/.sty == эталону из шаблона"
    severity: error
  - id: SYS-02
    src: DEP
    rule: "В преамбуле нет переопределений защищённых параметров"
    layer: script
    check: "regex по преамбуле: запрет \\setlength{полей/\\parindent}, \\renewcommand над caption/section, \\usepackage{geometry,fontspec,setspace} вне класса"
    severity: error
  - id: SYS-03
    src: DEP
    rule: "Документ компилируется"
    layer: script
    check: "latexmk exit 0; overfull hbox > 15pt — warn"
    severity: error

  # ── ОФОРМЛЕНИЕ ТЕКСТА (M1 §1.2.1) ──────────────────────────────
  - id: FMT-01
    src: "M1 §1.2.1"
    rule: "Основной текст Times New Roman {font_size_pt} пт, обычный"
    layer: class
    check: "fontspec в классе; контроль PDF: PyMuPDF — >=95% текстовых спанов name~TimesNewRoman, size=14±0.5"
    severity: error
  - id: FMT-02
    src: "M1 §1.2.1"
    rule: "Заголовки TNR того же кегля, полужирный"
    layer: class
    check: "titlesec в классе; PDF: спаны строк-заголовков имеют флаг bold"
    severity: error
  - id: FMT-03
    src: "M1 §1.2.1"
    rule: "Межстрочный интервал 1,5 (в M1 опечатка «1,5 пт» — трактуем как множитель)"
    layer: class
    check: "\\onehalfspacing в классе; PDF (опц.): медиана расстояний baseline ~ 1.5×кегль ±10%"
    severity: error
  - id: FMT-04
    src: "M1 §1.2.1"
    rule: "Абзацный отступ 12,5 мм"
    layer: class
    check: "\\parindent=12.5mm в классе"
    severity: error
  - id: FMT-05
    src: "M1 §1.2.1"
    rule: "Поля: слева 30, справа 10, сверху 20, снизу 20 мм"
    layer: class
    check: "geometry в классе; PDF: bbox текста каждой страницы внутри полей с допуском 2 мм и geometry tolerance {geometry_tolerance_pt} pt (ловит вылезшие таблицы/рисунки)"
    severity: error

  # ── РИСУНКИ (M1 §1.2.2) ────────────────────────────────────────
  - id: FIG-01
    src: "M1 §1.2.2"
    rule: "Рисунок после первого упоминания или на следующей странице"
    layer: script
    check: "PDF: страница подписи «Рисунок N» в диапазоне [страница первого \\ref, +1]"
    severity: warn
  - id: FIG-02
    src: "M1 §1.2.2"
    rule: "На каждый рисунок есть ссылка в тексте"
    layer: script
    check: "исходник: каждый figure имеет \\label и >=1 \\ref на него"
    severity: error
  - id: FIG-03
    src: "M1 §1.2.2"
    rule: "Ссылка словом: «в соответствии с рисунком 2», не «рис. 2»"
    layer: class+script
    check: "класс даёт макрос \\risref; script: regex запрет '[Рр]ис\\.\\s*\\d' в тексте"
    severity: error
  - id: FIG-04
    src: "M1 §1.2.2"
    rule: "Нумерация {fig_numbering} арабскими; в приложениях А.3"
    layer: class
    check: "счётчики в классе, в appendix — \\counterwithin"
    severity: error
  - id: FIG-05
    src: "M1 §1.2.2"
    rule: "Подпись «Рисунок N — Название» по центру под рисунком"
    layer: class
    check: "caption: labelsep=«—», position=below, justification=centering"
    severity: error
  - id: FIG-06
    src: "M1 §1.2.2"
    rule: "Перенос слов в наименовании рисунка не допускается"
    layer: class
    check: "\\hyphenpenalty=10000 внутри caption"
    severity: error
  - id: FIG-07
    src: "M1 §1.2.2"
    rule: "Многострочное наименование — через один интервал"
    layer: class
    check: "\\captionsetup{font={stretch=1}}"
    severity: error

  # ── ТАБЛИЦЫ (M1 §1.2.2) ────────────────────────────────────────
  - id: TAB-01
    src: "M1 §1.2.2"
    rule: "«Таблица N — Название» над таблицей, слева, без абзацного отступа"
    layer: class
    check: "caption: position=above, singlelinecheck=off, justification=raggedright"
    severity: error
  - id: TAB-02
    src: "M1 §1.2.2"
    rule: "Перенос таблицы: «Продолжение таблицы N» слева над продолжением"
    layer: class+script
    check: "класс даёт vkrlongtable с настроенным \\endhead; script: warn на голый longtable/table выше высоты страницы"
    severity: warn
  - id: TAB-03
    src: DEP
    rule: "На каждую таблицу есть ссылка в тексте (в M1 явно только для рисунков — подтвердить)"
    layer: script
    check: "как FIG-02, для table"
    severity: warn

  # ── ПОДПИСИ ОБЩЕЕ (M1 §1.2.2) ──────────────────────────────────
  - id: CAP-01
    src: "M1 §1.2.2"
    rule: "Наименования рисунков/таблиц с прописной буквы, без точки в конце"
    layer: script
    check: "regex по аргументам \\caption: первый символ [А-ЯA-Z], последний != '.'"
    severity: error

  # ── БИБЛИОГРАФИЯ (M1 §1.2.3, M2 §2.12) ─────────────────────────
  - id: BIB-01
    src: "M1 §1.2.3"
    rule: "Только затекстовые ссылки (бакалавриат)"
    layer: script
    check: "запрет \\footcite; \\footnote с URL/годом издания — warn"
    severity: error
  - id: BIB-02
    src: "M1 §1.2.3; M2 §2.3"
    rule: "Отсылки в квадратных скобках: [1]; [1,2]; [1-3, 5], нумерация в порядке упоминания"
    layer: class+script
    check: "biblatex-gost style=gost-numeric, sorting=none; script: литеральные '[\\d+]' в тексте вне \\cite → error («ручная» ссылка)"
    severity: error
  - id: BIB-03
    src: "M1 §1.2.3; M2 §2.12"
    rule: "Отсылки оформлены по ГОСТ Р 7.0.5-2008, библиографические описания — по ГОСТ Р 7.0.100-2018"
    layer: class+script
    check: "ссылки: ГОСТ Р 7.0.5-2008; рендер и script-линт .bib по ГОСТ Р 7.0.100-2018: обязательные поля по типу записи (author, title, year; для @online — url)"
    severity: error
  - id: BIB-04
    src: "M1 §1.2.3"
    rule: "Электронные ресурсы: URL + (дата обращения)"
    layer: script
    check: ".bib: у записей с url заполнен urldate"
    severity: error
  - id: BIB-05
    src: DEP
    rule: "Каждый источник списка процитирован в тексте"
    layer: script
    check: "biber: нет записей, попавших в библиографию через \\nocite{*}"
    severity: warn

  # ── СТРУКТУРА ДОКУМЕНТА (M2 §1) ────────────────────────────────
  - id: STR-01
    src: "M2 §1"
    rule: "Обязательные разделы в порядке: Аннотация, Введение, Обзор НТИ, Структурный системный анализ, Постановка задачи, Архитектурно-техническое решение, Математическая модель, Алгоритм, Программная реализация, Анализ результатов, Заключение, Список источников, Приложения"
    layer: script
    check: "парсинг дерева \\section (или PDF-outline): последовательность == эталону, fuzzy-match заголовков >=0.9"
    severity: error
  - id: STR-02
    src: "M2 §1"
    rule: "Вложенность подразделов не более одного уровня"
    layer: class
    check: "\\subsubsection в классе выдаёт ошибку компиляции"
    severity: error
  - id: STR-03
    src: "M2 §1"
    rule: "Каждый подраздел >=1 страницы"
    layer: script
    check: "PDF: разница страниц между соседними подзаголовками >=1"
    severity: warn
  - id: STR-04
    src: "M2 §2.2–2.11"
    rule: "Объёмы разделов в рекомендуемых диапазонах (стр.)"
    layer: script
    check: "PDF-outline → страниц на раздел; диапазоны: Введение 2–3, Обзор 3–5, Сист.анализ 6–7, Постановка 2–3, Архитектурное 4–6, Мат.модель 4–6, Алгоритм 4–5, Прогр.реализация 3–5, Анализ 2–4, Заключение 1–2"
    severity: warn
  - id: STR-05
    src: "M2 §1"
    rule: "Названия подразделов лаконичны, отражают суть (не «Анализ статьи Иванова И.И.»)"
    layer: llm
    check: "промпт по списку заголовков: тематические vs пересказные; эвристика script: заголовок содержит 'статьи <Фамилия И.О.>' → warn"
    severity: warn

  # ── АННОТАЦИЯ (M2 §2.1) ────────────────────────────────────────
  - id: ANN-01
    src: "M2 §2.1"
    rule: "6 элементов: объект и проблема (1 предл.); актуальность и значимость (1–2); цель (1); задачи (3–4); результаты (2–3); структура ВКР"
    layer: llm
    check: "structured output: {element: present|absent|weak, evidence: цитата <=10 слов} по каждому из 6"
    severity: warn
  - id: ANN-02
    src: "M2 §2.1"
    rule: "Монолитный связный текст, не поинты"
    layer: script
    check: "в окружении аннотации нет itemize/enumerate"
    severity: error
  - id: ANN-03
    src: "M2 §2.1"
    rule: "Заявленные количества страниц/рисунков/таблиц/приложений совпадают с фактом"
    layer: script
    check: "regex-извлечение чисел из аннотации <-> факт из PDF (страницы) и счётчиков (totcount)"
    severity: warn
    severity_final: error   # на прогоне перед сдачей

  # ── ВВЕДЕНИЕ (M2 §2.2) ─────────────────────────────────────────
  - id: INT-01
    src: "M2 §2.2"
    rule: "6 элементов: «местоположение» объекта; масштабность и важность; перечень задач и проблем объекта; аргументированная актуальность проблематики ВКР; существующие возможности решения (на примерах достижений); обоснование необходимости решения"
    layer: llm
    check: "structured output по каждому элементу, как ANN-01"
    severity: warn
  - id: INT-02
    src: "M2 §2.2"
    rule: "Монолитный текст, не поинты"
    layer: script
    check: "нет itemize/enumerate в разделе Введение"
    severity: error

  # ── ОБЗОР НТИ (M2 §2.3) ────────────────────────────────────────
  - id: REV-01
    src: "M2 §2.3"
    rule: "Не менее 20 источников"
    layer: script
    check: "count записей .bib, процитированных в разделе 2"
    severity: warn
    severity_final: error
  - id: REV-02
    src: "M2 §2.3"
    rule: "Не менее 10 — зарубежные рецензируемые издания"
    layer: script+llm
    check: "эвристика: latin-script записи типа article/inproceedings >=10 → pass; пограничные случаи — llm-классификация по bib-записи"
    severity: warn
  - id: REV-03
    src: "M2 §2.3"
    rule: "Обзор рассматривает исследования за последние 5 лет"
    layer: script
    check: "доля источников с year >= {defense_year}-5 среди цитируемых в разделе 2 >= {recent_sources_share}"
    severity: warn
  - id: REV-04
    src: "M2 §2.3"
    rule: "Запрещённые типы источников: учебники, методички, ВКР, препринты, научпоп (Habr, StackOverflow), Википедия и т.п."
    layer: script+llm
    check: "script: блэклист доменов в url (wikipedia.*, habr.com, stackoverflow.com, arxiv.org без пометки published) → error; llm: тип записи по метаданным → warn"
    severity: error
  - id: REV-05
    src: "M2 §2.3"
    rule: "Не последовательный пересказ источников, а сравнение/обобщение/классификация"
    layer: llm
    check: "промпт-критерий: структура эссе vs «источник за источником»; сигнал script: подразделы per-статья (см. STR-05)"
    severity: warn
  - id: REV-06
    src: "M2 §2.3"
    rule: "Обзор отражает: предпосылки и совр. состояние; цель/задачи/ключевые вопросы; методику отбора; библиографический анализ метаданных; сравнительный анализ целей-методов-результатов; ответы на вопросы; выводы с обоснованием выбора метода"
    layer: llm
    check: "structured output-чеклист из 7 аспектов"
    severity: warn
  - id: REV-07
    src: "M2 §2.3"
    rule: "Ссылки [N] расставлены по ходу изложения"
    layer: script
    check: "плотность \\cite в разделе 2: >=1 на страницу, абзацы >150 слов без \\cite → warn"
    severity: warn

  # ── СТРУКТУРНЫЙ СИСТЕМНЫЙ АНАЛИЗ (M2 §2.4) ─────────────────────
  - id: SSA-01
    src: "M2 §2.4"
    rule: "Сформирована модель «as is» — графическая схема в допустимой нотации (BPMN, IDEF0, UML, ERD, DFD, C4, 4+1 и др.)"
    layer: script+llm
    check: "script: >=1 рисунок в разделе 3; llm: описание модели и нотации присутствует в тексте"
    severity: warn
  - id: SSA-02
    src: "M2 §2.4"
    rule: "Для ПО-тематик: отражена «окружающая среда» + таблица интеграционного взаимодействия (система, адрес, протокол/API)"
    layer: llm
    check: "условный критерий: если тематика ПО → проверить наличие; тематику определяет llm по теме и постановке"
    severity: warn
  - id: SSA-03
    src: "M2 §2.4"
    rule: "Для вычислительных тематик: таблица структуры исходных данных (атрибут, вид, формат, частота, ед. изм., пример)"
    layer: llm
    check: "условный критерий, как SSA-02"
    severity: warn
  - id: SSA-04
    src: "M2 §2.4"
    rule: "Раздел предпроектный: ничего о конечном результате ВКР в описании и модели «as is»"
    layer: llm
    check: "промпт: упоминания разрабатываемого решения в разделе 3 → нарушение"
    severity: warn

  # ── ПОСТАНОВКА ЗАДАЧИ (M2 §2.5) ────────────────────────────────
  - id: TSK-01
    src: "M2 §2.5"
    rule: "Содержит: резюме анализа с обоснованием; цель; задачи; предполагаемый ключевой результат"
    layer: llm
    check: "structured output по 4 элементам"
    severity: warn
  - id: TSK-02
    src: "M2 §2.5"
    rule: "Задачи развёрнуты (антипример: «Разработать алгоритм.»)"
    layer: script+llm
    check: "script: пункт списка задач <30 симв. → warn; llm: развёрнутость и привязка к тематике"
    severity: warn
  - id: TSK-03
    src: "M2 §2.5"
    rule: "Цель и качественные требования допускают количественную оценку (методики расчёта — в Анализе результатов)"
    layer: llm
    check: "кросс-секционный критерий: цель из раздела 4 <-> численные показатели в разделе 9"
    severity: warn

  # ── АРХИТЕКТУРНОЕ РЕШЕНИЕ (M2 §2.6) ────────────────────────────
  - id: ARC-01
    src: "M2 §2.6"
    rule: "Сформирована модель «to be», соответствующая набору схем «as is», с обоснованием изменений"
    layer: script+llm
    check: "script: >=1 рисунок в разделе 5; llm: парность as is <-> to be, обоснование изменений"
    severity: warn
  - id: ARC-02
    src: "M2 §2.6"
    rule: "Для ПО-тематик: стек реализации и взаимодействие с окружением на схемах; способы удовлетворения требований из постановки"
    layer: llm
    check: "условный критерий"
    severity: warn

  # ── МАТЕМАТИЧЕСКАЯ МОДЕЛЬ (M2 §2.7) ────────────────────────────
  - id: MTH-01
    src: "M2 §2.7"
    rule: "Все формулы пронумерованы в порядке появления"
    layer: class+script
    check: "класс: equation с автонумерацией; script: запрет \\[ \\], $$..$$, equation* в разделе 6"
    severity: error
  - id: MTH-02
    src: "M2 §2.7"
    rule: "Данные введены как символьные переменные («Дано»); модель в общем виде без подстановки чисел; каждая переменная и формула с пояснением"
    layer: llm
    check: "промпт: наличие введения переменных, пояснений «где … — …», отсутствие численных прогонов"
    severity: warn
  - id: MTH-03
    src: "M2 §2.7"
    rule: "Присутствуют методики расчёта метрик качества и показателей достижения цели"
    layer: llm
    check: "structured output; кросс-проверка с TSK-03"
    severity: warn

  # ── АЛГОРИТМ (M2 §2.8) ─────────────────────────────────────────
  - id: ALG-01
    src: "M2 §2.8"
    rule: "Алгоритм представлен блок-схемой (для выч. тематик — по ГОСТ 19.701-90) или псевдокодом"
    layer: script+llm
    check: "script: в разделе 7 есть figure или algorithm-окружение; llm: тип представления соответствует тематике"
    severity: warn
  - id: ALG-02
    src: "M2 §2.8"
    rule: "В блоках схемы минимум текста: символьные обозначения переменных и процедур модели"
    layer: vision
    check: "VLM по извлечённым изображениям раздела 7 (опционально; иначе — человек)"
    severity: info
  - id: ALG-03
