[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gostcheck"
version = "0.1.0"
description = "Automated thesis normocontrol engine for GitHub CI/CD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "GostCheck team" }]
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.24,<5",
  "typer>=0.16,<1",
  "rich>=14.0,<15",
  "jinja2>=3.1,<4",
  "pylatexenc>=2.10,<3",
  "PyMuPDF>=1.26,<2",
  "pdfplumber>=0.11,<1",
  "bibtexparser>=1.4,<2",
  "pybtex>=0.24,<1",
  "openai>=1.97,<2",
  "httpx>=0.28,<1",
  "tenacity>=9.1,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-mock>=3.14,<4",
  "respx>=0.22,<1",
  "hypothesis>=6.136,<7",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-PyYAML>=6.0,<7",
  "pip-tools>=7.5,<8",
]

[project.scripts]
normocontrol = "normocontrol.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/normocontrol"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["normocontrol"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# User-facing diagnostics are written in Russian, so Cyrillic/Latin lookalikes
# inside strings are expected. Ruff still checks identifiers and all other rules.
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["normocontrol"]
