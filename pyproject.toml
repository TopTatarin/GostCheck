[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gostcheck"
version = "0.1.0"
description = "Automated thesis normocontrol engine for GitHub CI/CD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "GostCheck team" }]
dependencies = [
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "openai>=1.109,<2",
  "pylatexenc>=2.10,<3",
  "PyMuPDF>=1.26,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
  "rich>=14.0,<16",
  "tenacity>=9.1,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pip-tools>=7.5,<8",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
normocontrol = "normocontrol.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/normocontrol"]

[tool.pytest.ini_options]
# importlib mode: multiple test_*.py can share a basename (unit vs e2e vs semantic).
addopts = "-ra --strict-config --strict-markers -m 'not live' --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "acceptance: local smoke tests that require private real-PDF paths from environment variables",
  "live: tests that use external services; excluded from the default test run",
]

[tool.coverage.run]
branch = true
source = ["normocontrol"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# User-facing diagnostics are written in Russian, so Cyrillic/Latin lookalikes
# inside strings are expected. Ruff still checks identifiers and all other rules.
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["normocontrol"]
